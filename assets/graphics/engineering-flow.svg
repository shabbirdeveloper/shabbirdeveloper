<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="92" viewBox="0 0 1200 92" role="img" aria-labelledby="title desc">
  <title id="title">Engineering delivery workflow</title>
  <desc id="desc">An animated signal moves from idea through architecture, build, validation, and shipping.</desc>
  <defs>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2F81F7"/>
      <stop offset="0.5" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <filter id="signalGlow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    #movingSignal { animation: travel 7s cubic-bezier(.55, 0, .45, 1) infinite; }
    #shippingNode { animation: ready 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes travel {
      0% { transform: translateX(0); opacity: 0; }
      8% { opacity: 1; }
      88% { transform: translateX(930px); opacity: 1; }
      100% { transform: translateX(930px); opacity: 0; }
    }
    @keyframes ready {
      0%, 100% { opacity: .75; transform: scale(.92); }
      50% { opacity: 1; transform: scale(1.12); }
    }
    @media (prefers-reduced-motion: reduce) {
      #movingSignal, #shippingNode { animation: none; }
      #movingSignal { transform: translateX(930px); opacity: 1; }
    }
  </style>

  <rect x="1" y="1" width="1198" height="90" rx="18" fill="#0A111D" stroke="#243247"/>
  <path d="M135 44H1065" stroke="#1E293B" stroke-width="8" stroke-linecap="round"/>
  <path d="M135 44H1065" stroke="url(#track)" stroke-width="2" stroke-linecap="round" opacity="0.72"/>

  <g fill="#0A111D" stroke="#3B506B" stroke-width="2">
    <circle cx="135" cy="44" r="8"/>
    <circle cx="368" cy="44" r="8"/>
    <circle cx="600" cy="44" r="8"/>
    <circle cx="833" cy="44" r="8"/>
    <circle id="shippingNode" cx="1065" cy="44" r="8" fill="#0E2B28" stroke="#2DD4BF"/>
  </g>

  <circle id="movingSignal" cx="135" cy="44" r="6" fill="#67E8F9" filter="url(#signalGlow)"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="750" letter-spacing="1.4" text-anchor="middle">
    <text x="135" y="73" fill="#8394AA">IDEA</text>
    <text x="368" y="73" fill="#8394AA">ARCHITECTURE</text>
    <text x="600" y="73" fill="#8394AA">BUILD</text>
    <text x="833" y="73" fill="#8394AA">VALIDATE</text>
    <text x="1065" y="73" fill="#A7F3D0">SHIP</text>
  </g>
</svg>
