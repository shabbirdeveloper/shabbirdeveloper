<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
  <title id="title">What Shabbir Hussain is building</title>
  <desc id="desc">A dark navy information panel describing current products, engineering focus, technology stack, and areas of interest.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071525"/>
      <stop offset="0.58" stop-color="#0A1B2E"/>
      <stop offset="1" stop-color="#082634"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <radialGradient id="ambient" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#38BDF8" stop-opacity=".18"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#7DD3FC" stroke-opacity=".035"/>
    </pattern>
  </defs>
  <style>
    #softGlow { animation: breathe 7s ease-in-out infinite; transform-origin: center; }
    @keyframes breathe {
      0%, 100% { opacity: .62; transform: scale(.94); }
      50% { opacity: 1; transform: scale(1.08); }
    }
    @media (prefers-reduced-motion: reduce) {
      #softGlow { animation: none; }
    }
  </style>

  <rect x="1" y="1" width="1198" height="348" rx="24" fill="url(#panel)" stroke="#23415C" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="348" rx="24" fill="url(#grid)"/>
  <circle id="softGlow" cx="1080" cy="32" r="230" fill="url(#ambient)"/>
  <rect x="28" y="25" width="7" height="300" rx="3.5" fill="url(#accent)"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <g transform="translate(58 25)">
      <g>
        <rect width="1112" height="66" rx="14" fill="#0C2035" stroke="#1E3A55"/>
        <text x="25" y="27" fill="#7DD3FC" font-size="12" font-weight="800" letter-spacing="1.4">CURRENTLY BUILDING</text>
        <text x="25" y="49" fill="#F8FAFC" font-size="18" font-weight="650">Production-ready SaaS, marketplace, and AI-native products</text>
      </g>
      <g transform="translate(0 76)">
        <rect width="1112" height="66" rx="14" fill="#0A1D31" stroke="#1E3A55"/>
        <text x="25" y="27" fill="#7DD3FC" font-size="12" font-weight="800" letter-spacing="1.4">ENGINEERING FOCUS</text>
        <text x="25" y="49" fill="#E2E8F0" font-size="18" font-weight="600">Full-stack architecture, scalable APIs, secure data workflows, and modern web applications</text>
      </g>
      <g transform="translate(0 152)">
        <rect width="1112" height="66" rx="14" fill="#0C2035" stroke="#1E3A55"/>
        <text x="25" y="27" fill="#7DD3FC" font-size="12" font-weight="800" letter-spacing="1.4">WORKING WITH</text>
        <text x="25" y="49" fill="#E2E8F0" font-size="18" font-weight="600">React · Next.js · TypeScript · Node.js · Supabase · PostgreSQL · Python</text>
      </g>
      <g transform="translate(0 228)">
        <rect width="1112" height="66" rx="14" fill="#0A1D31" stroke="#1E3A55"/>
        <text x="25" y="27" fill="#7DD3FC" font-size="12" font-weight="800" letter-spacing="1.4">INTERESTED IN</text>
        <text x="25" y="49" fill="#E2E8F0" font-size="18" font-weight="600">AI-native product engineering and scalable digital platforms</text>
      </g>
    </g>
  </g>
</svg>
