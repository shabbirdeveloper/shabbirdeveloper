<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
  <title id="title">Engineering highlights</title>
  <desc id="desc">Three dark navy cards describing end-to-end delivery, platform architecture, and secure foundations.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071525"/>
      <stop offset="0.54" stop-color="#0A1B2E"/>
      <stop offset="1" stop-color="#082634"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity=".14"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    #ambientGlow { animation: breathe 7.5s ease-in-out infinite; transform-origin: center; }
    .numberDot { animation: pulse 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .numberDot:nth-of-type(2) { animation-delay: -1.05s; }
    .numberDot:nth-of-type(3) { animation-delay: -2.1s; }
    @keyframes breathe {
      0%, 100% { opacity: .65; transform: scale(.94); }
      50% { opacity: 1; transform: scale(1.08); }
    }
    @keyframes pulse {
      0%, 100% { opacity: .72; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      #ambientGlow, .numberDot { animation: none; }
    }
  </style>

  <rect x="1" y="1" width="1198" height="348" rx="24" fill="url(#background)" stroke="#23415C" stroke-width="2"/>
  <circle id="ambientGlow" cx="600" cy="350" r="310" fill="url(#glow)"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <g transform="translate(28 28)">
      <rect width="366" height="294" rx="20" fill="#0C2035" stroke="#264763"/>
      <rect x="1" y="1" width="364" height="5" rx="3" fill="url(#accent)"/>
      <circle class="numberDot" cx="48" cy="52" r="23" fill="#0E3348" stroke="#38BDF8"/>
      <text x="48" y="59" text-anchor="middle" fill="#7DD3FC" font-size="17" font-weight="800">01</text>
      <text x="82" y="58" fill="#F8FAFC" font-size="19" font-weight="750">End-to-end delivery</text>
      <text x="28" y="112" fill="#B8C7D9" font-size="17">
        <tspan x="28" dy="0">Product thinking from architecture</tspan>
        <tspan x="28" dy="30">and interface design through</tspan>
        <tspan x="28" dy="30">implementation, validation, and</tspan>
        <tspan x="28" dy="30">cloud deployment.</tspan>
      </text>
      <text x="28" y="268" fill="#2DD4BF" font-size="12" font-weight="800" letter-spacing="1.5">IDEA → PRODUCTION</text>
    </g>

    <g transform="translate(417 28)">
      <rect width="366" height="294" rx="20" fill="#0A1D31" stroke="#264763"/>
      <rect x="1" y="1" width="364" height="5" rx="3" fill="url(#accent)"/>
      <circle class="numberDot" cx="48" cy="52" r="23" fill="#0E3348" stroke="#38BDF8"/>
      <text x="48" y="59" text-anchor="middle" fill="#7DD3FC" font-size="17" font-weight="800">02</text>
      <text x="82" y="58" fill="#F8FAFC" font-size="19" font-weight="750">Platform architecture</text>
      <text x="28" y="112" fill="#B8C7D9" font-size="17">
        <tspan x="28" dy="0">Multi-role applications, multilingual</tspan>
        <tspan x="28" dy="30">experiences, data-driven dashboards,</tspan>
        <tspan x="28" dy="30">API services, and real-time product</tspan>
        <tspan x="28" dy="30">workflows.</tspan>
      </text>
      <text x="28" y="268" fill="#2DD4BF" font-size="12" font-weight="800" letter-spacing="1.5">SYSTEMS THAT SCALE</text>
    </g>

    <g transform="translate(806 28)">
      <rect width="366" height="294" rx="20" fill="#0C2035" stroke="#264763"/>
      <rect x="1" y="1" width="364" height="5" rx="3" fill="url(#accent)"/>
      <circle class="numberDot" cx="48" cy="52" r="23" fill="#0E3348" stroke="#38BDF8"/>
      <text x="48" y="59" text-anchor="middle" fill="#7DD3FC" font-size="17" font-weight="800">03</text>
      <text x="82" y="58" fill="#F8FAFC" font-size="19" font-weight="750">Secure foundations</text>
      <text x="28" y="112" fill="#B8C7D9" font-size="17">
        <tspan x="28" dy="0">Authentication, authorization,</tspan>
        <tspan x="28" dy="30">PostgreSQL row-level security,</tspan>
        <tspan x="28" dy="30">protected operations, and clean</tspan>
        <tspan x="28" dy="30">application boundaries.</tspan>
      </text>
      <text x="28" y="268" fill="#2DD4BF" font-size="12" font-weight="800" letter-spacing="1.5">SECURE BY DESIGN</text>
    </g>
  </g>
</svg>
