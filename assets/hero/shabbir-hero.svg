<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Shabbir Hussain — Full-Stack Software Engineer</title>
  <desc id="desc">A dark premium engineering banner introducing Shabbir Hussain as a full-stack software engineer, AI-native web engineer, and product builder based in Malaysia.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B14"/>
      <stop offset="0.58" stop-color="#0A1020"/>
      <stop offset="1" stop-color="#07151A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2F81F7"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7DD3FC" stroke-opacity="0.055"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000814" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1200" height="440" rx="28" fill="url(#background)"/>
  <rect width="1200" height="440" rx="28" fill="url(#grid)"/>
  <circle cx="1002" cy="118" r="250" fill="url(#glow)"/>
  <circle cx="98" cy="452" r="190" fill="#2F81F7" opacity="0.065"/>
  <rect x="1" y="1" width="1198" height="438" rx="27" fill="none" stroke="#263244"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <g transform="translate(66 52)">
      <rect width="264" height="34" rx="17" fill="#102335" stroke="#24455F"/>
      <circle cx="18" cy="17" r="5" fill="#2DD4BF"/>
      <text x="32" y="22" fill="#9CC7D8" font-size="12" font-weight="700" letter-spacing="1.4">MALAYSIA · PRODUCT ENGINEERING</text>
    </g>

    <text x="66" y="148" fill="#F8FAFC" font-size="54" font-weight="800" letter-spacing="-1.8">SHABBIR HUSSAIN</text>
    <rect x="67" y="164" width="424" height="5" rx="2.5" fill="url(#accent)"/>

    <text x="66" y="214" fill="#B9C7D8" font-size="22" font-weight="650">FULL-STACK SOFTWARE ENGINEER</text>
    <text x="66" y="247" fill="#B9C7D8" font-size="22" font-weight="650">AI-NATIVE WEB ENGINEER · PRODUCT BUILDER</text>

    <text x="66" y="298" fill="#7F91A8" font-size="17">I design and ship scalable digital products</text>
    <text x="66" y="324" fill="#7F91A8" font-size="17">from architecture to deployment.</text>

    <g transform="translate(66 360)" font-size="12" font-weight="700" letter-spacing="0.4">
      <g>
        <rect width="92" height="32" rx="8" fill="#101827" stroke="#27364A"/>
        <text x="46" y="21" text-anchor="middle" fill="#DCE7F5">REACT</text>
      </g>
      <g transform="translate(102)">
        <rect width="96" height="32" rx="8" fill="#101827" stroke="#27364A"/>
        <text x="48" y="21" text-anchor="middle" fill="#DCE7F5">NEXT.JS</text>
      </g>
      <g transform="translate(208)">
        <rect width="112" height="32" rx="8" fill="#101827" stroke="#27364A"/>
        <text x="56" y="21" text-anchor="middle" fill="#DCE7F5">TYPESCRIPT</text>
      </g>
      <g transform="translate(330)">
        <rect width="92" height="32" rx="8" fill="#101827" stroke="#27364A"/>
        <text x="46" y="21" text-anchor="middle" fill="#DCE7F5">NODE.JS</text>
      </g>
      <g transform="translate(432)">
        <rect width="104" height="32" rx="8" fill="#101827" stroke="#27364A"/>
        <text x="52" y="21" text-anchor="middle" fill="#DCE7F5">SUPABASE</text>
      </g>
    </g>

    <g transform="translate(734 55)" filter="url(#shadow)">
