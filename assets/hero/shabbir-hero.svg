      <rect width="405" height="49" rx="20" fill="#111B2A"/>
      <path d="M0 49H405" stroke="#26364B"/>
      <circle cx="24" cy="24" r="5" fill="#FB7185"/>
      <circle cx="43" cy="24" r="5" fill="#FBBF24"/>
      <circle cx="62" cy="24" r="5" fill="#34D399"/>
      <text x="89" y="29" fill="#7F91A8" font-size="12" font-weight="650">product.engineer.ts</text>

      <g transform="translate(28 79)" font-family="Cascadia Code, Consolas, monospace" font-size="14">
        <text x="0" y="0" fill="#64748B">01</text>
        <text x="34" y="0" fill="#C4B5FD">const</text>
        <text x="81" y="0" fill="#E2E8F0">engineer = {</text>

        <text x="0" y="32" fill="#64748B">02</text>
        <text x="54" y="32" fill="#7DD3FC">focus:</text>
        <text x="112" y="32" fill="#A7F3D0">&quot;real products&quot;</text>
        <text x="239" y="32" fill="#E2E8F0">,</text>

        <text x="0" y="64" fill="#64748B">03</text>
        <text x="54" y="64" fill="#7DD3FC">architecture:</text>
        <text x="166" y="64" fill="#A7F3D0">&quot;scalable&quot;</text>
        <text x="253" y="64" fill="#E2E8F0">,</text>

        <text x="0" y="96" fill="#64748B">04</text>
        <text x="54" y="96" fill="#7DD3FC">experience:</text>
        <text x="158" y="96" fill="#A7F3D0">&quot;intentional&quot;</text>
        <text x="270" y="96" fill="#E2E8F0">,</text>

        <text x="0" y="128" fill="#64748B">05</text>
        <text x="54" y="128" fill="#7DD3FC">delivery:</text>
        <text x="141" y="128" fill="#A7F3D0">&quot;production&quot;</text>
        <text x="244" y="128" fill="#E2E8F0">,</text>

        <text x="0" y="160" fill="#64748B">06</text>
        <text x="54" y="160" fill="#7DD3FC">mindset:</text>
        <text x="133" y="160" fill="#A7F3D0">&quot;keep shipping&quot;</text>

        <text x="0" y="192" fill="#64748B">07</text>
        <text x="34" y="192" fill="#E2E8F0">};</text>
      </g>

      <g transform="translate(28 286)">
        <rect width="349" height="26" rx="8" fill="#0D211F" stroke="#1E514A"/>
        <circle cx="16" cy="13" r="4" fill="#2DD4BF"/>
        <text x="29" y="17" fill="#8EE6DA" font-size="11" font-weight="700" letter-spacing="1.2">SYSTEM STATUS</text>
        <text x="328" y="17" text-anchor="end" fill="#D4FFF8" font-size="11" font-weight="800">SHIPPING</text>
      </g>
    </g>
